server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    # Docker DNS resolver
    resolver 127.0.0.11 valid=30s;


    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Deny access to sensitive files (Ported from .htaccess)
    location ~ ^/config(|\.local)\.ini$|^\..*$|^composer\.(json|lock)$ {
        deny all;
    }

    # Deny access to editor files
    location ~ (^#.*#|\.(bak|conf|dist|in[ci]|log|orig|sh|sql|sw[op])|~)$ {
        deny all;
    }

    # Static assets in ui/
    location /ui/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Deny access to app internal directories
    location ~ /(assets|app|config|tmp|libs|vendor|extension|tests|coverage|.github) {
        deny all;
    }

    # Special handling for install and sensor
    location ~ /(install|sensor)/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Deny documentation files
    location ~ /(README|CHANGELOG|LICENSE|AUTHORS|CODE_OF_CONDUCT|LEGALNOTICE|RELEASE_NOTES|SECURITY|FILE_ID)(|\.txt|\.md|\.diz|\.DIZ)$ {
        deny all;
    }

    # Main rewrite rule for Fat-Free Framework
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM Backend proxy
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass endoguard_backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Allow access to robots.txt
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    client_max_body_size 100M;
}
